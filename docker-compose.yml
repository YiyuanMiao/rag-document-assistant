# One-command dev stack: single-node OpenSearch + the RAG backend.
# If you already run your own OpenSearch cluster, delete the `opensearch`
# service and point OPENSEARCH_URL at it in server/.env instead.
services:
  opensearch:
    image: opensearchproject/opensearch:2.17.0
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=false
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=MyPassword123!
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -u admin:MyPassword123! https://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      - OPENSEARCH_URL=https://opensearch:9200
      - OPENSEARCH_USER=admin
      - OPENSEARCH_PASSWORD=MyPassword123!
      - OPENSEARCH_SSL_VERIFY=false
    ports:
      - "5001:5001"
    depends_on:
      opensearch:
        condition: service_healthy
